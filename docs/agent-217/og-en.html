<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Heebo:wght@500;700;800&display=swap" rel="stylesheet">
<style>*{margin:0;box-sizing:border-box}html,body{width:1200px;height:630px;overflow:hidden}.clip{position:fixed;inset:0;overflow:hidden;pointer-events:none}body{background:#F7F4EE;color:#111;font-family:'Inter',Arial,sans-serif;padding:72px 84px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center}.logo{height:44px}.ey{font-size:20px;font-weight:700;letter-spacing:.08em;color:#E3170A}
h1{font-size:72px;line-height:1.05;font-weight:800;letter-spacing:-.04em;max-width:960px}h1 em{font-style:normal;color:#E3170A}
.bot{display:flex;justify-content:space-between;align-items:flex-end;border-top:2px solid #D8D3C9;padding-top:26px;font-size:28px;font-weight:500;color:#42413D}
.dom{font-family:Inter;font-weight:700;color:#111}
.orb{position:absolute;top:-40px;right:-200px;width:470px;height:470px;border:1.5px solid #D8D3C9;border-radius:50%}
.orb:after{content:'';position:absolute;inset:150px;border:1.5px solid #D8D3C9;border-radius:50%}.dot{position:absolute;width:30px;height:30px;border-radius:50%;background:#E3170A;top:155px;right:6px}
</style></head><body><div class="clip"><div class="orb"></div><div class="dot"></div></div>
<div class="top"><img class="logo" src="logo.svg"><span class="ey">Founder-led growth</span></div>
<h1>Your hardest-to-copy advantage is <em>you</em>.</h1><div class="bot"><span>Authority that compounds, for founder-CEOs.</span><span class="dom">growgravity.com</span></div></body></html>
